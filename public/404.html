<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie - Redirecting...</title>
    <link rel="icon" type="image/svg+xml" href="/foodie/favicon.svg" />
    <link rel="apple-touch-icon" href="/foodie/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#10b981" />
    <script>
      // GitHub Pages SPA redirect - https://github.com/rafgraph/spa-github-pages
      (function() {
        var pathSegmentsToKeep = 1; // Keep "/foodie" segment
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      .logo {
        font-size: 3rem;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1.1rem;
        opacity: 0.9;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 1.5rem auto 0;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: white;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">🍽️</div>
      <h1>Foodie</h1>
      <p>Redirecting...</p>
      <div class="spinner"></div>
      <noscript>
        <p style="margin-top: 2rem;">JavaScript is required. <a href="/foodie/">Go to homepage</a>.</p>
      </noscript>
    </div>
  </body>
</html>
