name: Deploy to GitHub Pages

# Node 22 + ASTRO_BASE only — no MkDocs/Python step (roadmap D12, Issue 006).
# Deploys on push to `main`. Until the cutover (Issue 030) `main` still holds
# the legacy SPA with its own deploy.yml; this file lives on `inceptor` and
# becomes the live deploy when `inceptor` is merged into `main`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Single concurrent deployment — newer pushes cancel older runs in progress
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # The release version (package.json, bumped per CHANGELOG release;
      # roadmap Issue 048) is inlined as PUBLIC_VERSION and shown in the
      # FeedbackFAB diagnostics next to PUBLIC_BUILD_SHA.
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build
        run: npm run build
        env:
          # GitHub *project* pages serve at `<domain>/<repo>/`, so the build
          # needs the repo name as its base path. Defaults to this repo's slug;
          # override with an ASTRO_BASE repo secret (e.g. set it to `/` if you
          # later move to a root/custom-domain user-pages deploy).
          ASTRO_BASE: ${{ secrets.ASTRO_BASE || '/foodie' }}
          # Where the FeedbackFAB / report-issue links file issues (roadmap
          # Issue 007). Inlined at build; forks override with a repo variable.
          PUBLIC_REPO_SLUG: ${{ vars.PUBLIC_REPO_SLUG || 'ArtemioPadilla/foodie' }}
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          PUBLIC_VERSION: ${{ steps.version.outputs.version }}
          # Marks the production build: astro.config.mjs refuses to build
          # if PUBLIC_AUTH_MOCK (the dev/test mock auth adapter) is also set.
          FOODIE_DEPLOY: '1'
          # Firebase Auth (roadmap D9, Issue 035, ADR 0012). Repository
          # secrets; any one missing → auth is disabled in the build (the
          # site still deploys). No GitHub client secret: the OAuth app's
          # secret lives only in the Firebase console (D10).
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
