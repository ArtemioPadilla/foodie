name: Lighthouse Pre-Deploy Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lighthouse-localhost:
    name: Lighthouse Quick Check (Localhost)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run Lighthouse CI (Localhost)
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.lighthouserc.localhost.json'

      - name: Check Lighthouse scores
        run: |
          echo "✅ Pre-deployment Lighthouse check completed"
          echo "Testing localhost build for:"
          echo "  - Accessibility issues"
          echo "  - Basic PWA configuration"
          echo "  - Bundle size optimization"
          echo "  - Console errors"
          echo ""
          echo "Note: Some checks (CSP, service workers, PWA install) require"
          echo "HTTPS and will be validated in post-deployment production test."
