name: Lighthouse CI

on:
  # Run after deployment completes
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types:
      - completed
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Performance Check (Production)
    runs-on: ubuntu-latest
    # Only run if deployment succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting 30 seconds for GitHub Pages to update..."
          sleep 30

      - name: Run Lighthouse CI on Production
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://artemiopadilla.github.io/foodie/
            https://artemiopadilla.github.io/foodie/recipes
            https://artemiopadilla.github.io/foodie/planner
            https://artemiopadilla.github.io/foodie/shopping
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Check Lighthouse scores
        run: |
          echo "✅ Lighthouse audit completed on production deployment"
          echo "Testing actual HTTPS environment with:"
          echo "  - Real service worker functionality"
          echo "  - Actual PWA installation capabilities"
          echo "  - Production CDN performance"
          echo "Results available in artifacts"
